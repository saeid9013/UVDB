[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uvdb"
version = "0.1.0"
description = "Universal Video Downloader Telegram bot for Railway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<6",
  "arq>=0.26,<1",
  "aiogram>=3.15,<4",
  "yt-dlp>=2025.1.15",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

